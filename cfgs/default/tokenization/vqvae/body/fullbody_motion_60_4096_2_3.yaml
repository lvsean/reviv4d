run_name: auto

# Architecture
encoder_type: BodyTransformer
decoder_type: BodyTransformer
num_frames: 60
post_mlp: True
body_joint_nums: 60
tubelet_size: [2, 3]

# Quantizer
codebook_size: 4096
latent_dim: 32
norm_codes: True
quantizer_type: lucid
coef_ema_dead_code: 32.0
code_replacement_policy: batch_random
commitment_weight: 1.0
quantizer_ema_decay: 0.99
kmeans_init: False

# Losses
loss_fn: mse_mask_fullbody
dtype_percept: fp32
codebook_weight: 1.0

# Train
dtype: fp32
epochs: 1000
opt: adamw
opt_betas: [0.9, 0.99]
blr: 0.0001
warmup_lr: 0.000001
min_lr: 0.
warmup_epochs: 5
batch_size: 64
clip_grad: 1.0
model_ema: False
model_ema_decay: 0.9999
model_ema_update_freq: 1
find_unused_params: False
save_ckpt_freq: 1
init_weights: False

# Eval
step_eval: False
epoch_eval: True
eval_freq: 1
eval_metrics_freq: 0
eval_image_log_freq: 0
num_eval_metrics_samples: 50000
num_logged_images: 100
input_size_eval: 224

# Data
domain: fullbody
imagenet_default_mean_and_std: False
min_crop_scale: 0.8
data_path: "./example_data/full_body/full_body_train_60.npy"
eval_data_path: null

# Wandb
log_wandb: True
wandb_project: 'reviv-body-tokenizers'
wandb_entity: null
wandb_run_name: auto
output_dir: './output/auto'
